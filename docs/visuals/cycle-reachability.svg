   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19364d" x="36" y="43.500563" transform="rotate(-0 36 43.500563)">Reach a cycle without repeating DFS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="36" y="66.561262" transform="rotate(-0 36 66.561262)">Reverse sink elimination keeps cycle vertices and every vertex that can reach them.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #19364d" x="108" y="183.250938" transform="rotate(-0 108 183.250938)">A</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #19364d" x="280.8" y="143.074938" transform="rotate(-0 280.8 143.074938)">B</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #19364d" x="475.2" y="143.074938" transform="rotate(-0 475.2 143.074938)">C</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #19364d" x="280.8" y="245.746938" transform="rotate(-0 280.8 245.746938)">D</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #19364d" x="475.2" y="245.746938" transform="rotate(-0 475.2 245.746938)">E</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #007f79" x="108" y="218.736" transform="rotate(-0 108 218.736)">still has B</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f79" x="561.6" y="133.92" transform="rotate(-0 561.6 133.92)">A, B, C survive</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="561.6" y="154.008" transform="rotate(-0 561.6 154.008)">A reaches B ↔ C</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b66432" x="561.6" y="238.824" transform="rotate(-0 561.6 238.824)">D, E are removed</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="561.6" y="258.912" transform="rotate(-0 561.6 258.912)">Neither reaches a cycle</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19364d" x="47.52" y="311.197969" transform="rotate(-0 47.52 311.197969)">1  Remove E</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #19364d" transform="translate(47.52 336.082359)">E has no outgoing edges.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #19364d" transform="translate(47.52 351.430324)">Its predecessor D becomes a sink.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19364d" x="267.12" y="311.197969" transform="rotate(-0 267.12 311.197969)">2  Remove D</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #19364d" transform="translate(267.12 336.082359)">A loses the edge to D.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #19364d" transform="translate(267.12 351.430324)">Its edge to B keeps it alive.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19364d" x="486.72" y="311.197969" transform="rotate(-0 486.72 311.197969)">3  Answer queries</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #19364d" transform="translate(486.72 336.082359)">Survivor → safe</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #19364d" transform="translate(486.72 351.430324)">Removed or unknown → trapped</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f79" x="36" y="401.76" transform="rotate(-0 36 401.76)">One graph pass: O(V + E) preprocessing  •  Expected O(1) per named query</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="36" y="423.1872" transform="rotate(-0 36 423.1872)">Survivors have a surviving successor: following successors in a finite graph must repeat a vertex.</text>
   </g>
  </g>
 </g>
